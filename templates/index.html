<!DOCTYPE html>
<html>
<head>
    <title>DEVICE GLITCHER</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

body {
    margin: 0;
    font-family: 'Share Tech Mono', monospace;
    background: radial-gradient(circle at center, #020617 0%, #000000 100%);
    color: #00ff9c;
}

/* HEADER */
.header {
    padding: 15px;
    border-bottom: 1px solid #00ff9c33;
    text-align: center;
}

.header h1 {
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #00ff9c88;
}

/* SELECT */
#actionSelect {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border-radius: 6px;
    background: black;
    color: #00ff9c;
    border: 1px solid #00ff9c55;
    margin-bottom: 20px;
}

/* MAIN */
.main {
    padding: 15px;
}

/* CARD */
.card {
    background: rgba(0, 0, 0, 0.85);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #00ff9c33;
    box-shadow: 0 0 20px #00ff9c11;
}

/* TITLE */
h3 {
    margin-top: 0;
    color: #00ff9c;
}

/* FIELDS */
.field {
    margin-bottom: 15px;
}

.field label {
    font-size: 13px;
    opacity: 0.7;
}

/* INPUTS */
input, select {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #00ff9c44;
    background: black;
    color: #00ff9c;
    font-size: 15px;
    outline: none;
}

/* INPUT FOCUS GLOW */
input:focus, select:focus {
    border-color: #00ff9c;
    box-shadow: 0 0 8px #00ff9c88;
}

/* BUTTON */
button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    font-size: 15px;
    background: transparent;
    border: 1px solid #00ff9c;
    border-radius: 8px;
    color: #00ff9c;
    cursor: pointer;
    transition: all 0.2s ease;
}


button:active {
    background: #00ff9c;
    color: black;
    box-shadow: 0 0 15px #00ff9caa;
}

/* STATUS */
.status {
    margin-top: 10px;
    font-size: 12px;
    color: #00ff9caa;
}

/* OUTPUT TERMINAL */
.output {
    margin-top: 15px;
    background: black;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
    border: 1px solid #00ff9c33;
    box-shadow: inset 0 0 10px #00ff9c22;
}

/* SCROLLBAR (yes, even this matters) */
.output::-webkit-scrollbar {
    width: 6px;
}
.output::-webkit-scrollbar-thumb {
    background: #00ff9c;
}

/* DESKTOP */
@media (min-width: 768px) {
    .main {
        display: flex;
        justify-content: center;
    }

    .card {
        width: 400px;
    }
}

.field input,
.field select {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
}
</style>
</head>
<body>

<div class="header">
    <h1>DEVICE GLITCHER</h1>
</div>

<div class="main">
    <select id="actionSelect">
      <option selected disabled>-- SELECT OPTION --</option>
    </select>
    <div class="card">
        <h3 id="title">Command</h3>

        <div id="formArea"></div>

        <button onclick="runCommand()">Run</button>

        <div class="status" id="status"></div>
        <div class="output" id="output"></div>
    </div>
</div>

<script>
let schema = {};

fetch("/schema")
    .then(res => res.json())
    .then(data => {
        schema = data;
        loadActions();
    });

function loadActions() {
    const select = document.getElementById("actionSelect");

    for (let action in schema) {
        let opt = document.createElement("option");
        opt.value = action;
        opt.text = action.toUpperCase();
        select.appendChild(opt);
    }

    select.onchange = renderForm;
    renderForm();
}

function renderForm() {
    const action = document.getElementById("actionSelect").value;
    const formArea = document.getElementById("formArea");
    const title = document.getElementById("title");

    formArea.innerHTML = "";
    title.innerText = action.toUpperCase();

    const fields = schema[action].fields;

    for (let key in fields) {
        let field = fields[key];

        // Create wrapper
        let wrapper = document.createElement("div");
        wrapper.className = "field";

        // Label
        let label = document.createElement("label");
        label.innerText = key;
        wrapper.appendChild(label);

        let inputElement;

        if (field.type === "select") {
            inputElement = document.createElement("select");

            field.options.forEach(optVal => {
                let opt = document.createElement("option");
                opt.value = optVal;
                opt.text = optVal;
                inputElement.appendChild(opt);
            });
        }

        if (field.type === "text" || field.type === "number") {
            inputElement = document.createElement("input");
            inputElement.type = field.type;
        }

        inputElement.id = key;

        wrapper.appendChild(inputElement);
        formArea.appendChild(wrapper);
    }
}

function runCommand() {
    const action = document.getElementById("actionSelect").value;
    const payload = { action: action };

    const fields = schema[action].fields;

    for (let key in fields) {
        payload[key] = document.getElementById(key).value;
    }

    document.getElementById("status").innerText = "Running...";
    document.getElementById("output").innerText = "";

    fetch("/run", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("status").innerText = "Done";
        document.getElementById("output").innerText =
            data.output || data.error;
    })
    .catch(() => {
        document.getElementById("status").innerText = "Error";
    });
}
</script>

</body>
</html>
